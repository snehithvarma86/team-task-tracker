version: '3.8'

services:
  api:
    build: .
    container_name: task_tracker_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://admin:password123@db:5432/task_tracker
      - REDIS_URL=redis://cache:6379
      - JWT_SECRET=super_secret_key_change_in_production
    depends_on:
      - db
      - cache
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:15-alpine
    container_name: task_tracker_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: task_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: task_tracker_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: